[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pygeofilter-duckdb"
dynamic = ["version"]
description = "Translate OGC filters into DuckDB SQL for GeoParquet queries"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = []
authors = [
  { name = "Fabrice Brito", email = "fabrice.brito@terradue.com" },
  { name = "Simone Tripodi", email = "simone.tripodi@terradue.com"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "pygeofilter>=0.4.0,<0.5.0",
  "duckdb>=1.1.3,<1.6.0",
  "shapely",
  "pystac_client",
  "stac-geoparquet",
]

[project.urls]
Documentation = "https://github.com/Terradue/pygeofilter-duckdb#readme"
Issues = "https://github.com/Terradue/pygeofilter-duckdb/issues"
Source = "https://github.com/Terradue/pygeofilter-duckdb"

[tool.hatch.version]
path = "src/pygeofilter_duckdb/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pygeofilter_duckdb"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/example", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.envs.dev]
dependencies = ["ruff", "mypy", "bandit", "pytest", "types-shapely", "pyarrow-stubs"]

[tool.hatch.envs.dev.scripts]
quality = ["ruff format --check src tests", "ruff check src tests", "mypy src tests", "bandit -r src"]
check = ["ruff format --check src tests", "ruff check src tests", "mypy src tests", "bandit -r src", "pytest -q"]
format-check = "ruff format --check src tests"
lint-check = "ruff check src tests"
typecheck = "mypy src tests"
security = "bandit -r src"

[tool.hatch.envs.test]
dependencies = ["pytest"]

[tool.hatch.envs.test.scripts]
test = "pytest -q"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["pygeofilter.*"]
follow_untyped_imports = true

[tool.coverage.run]
source_pkgs = ["pygeofilter_duckdb", "tests"]
branch = true
parallel = true
omit = [
  "src/pygeofilter_duckdb/__about__.py",
]

[tool.coverage.paths]
pygeofilter_duckdb = ["src/pygeofilter_duckdb", "*/pygeofilter-duckdb/src/pygeofilter_duckdb"]
tests = ["tests", "*/pygeofilter-duckdb/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
