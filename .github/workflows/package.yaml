name: publish-to-pypi

on:
  push:
    branches:
    - develop
    - main
    paths:
    - src/**
    - tests/**
    - example/**
    - pyproject.toml
    - .github/workflows/package.yaml
    - README.md
  release:
    types:
    - published
  pull_request:
    branches:
    - develop
    - main
    paths:
    - src/**
    - tests/**
    - example/**
    - pyproject.toml
    - .github/workflows/package.yaml

permissions:
  contents: read
  packages: write

jobs:

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
        duckdb: ['1.1.3', '1.2.0', '1.5.6']
        pygeofilter: ['0.4.0']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        cache: pip
    - name: Install compatibility dependencies
      run: >-
        python -m pip install -e . pytest
        "duckdb==${{ matrix.duckdb }}"
        "pygeofilter==${{ matrix.pygeofilter }}"
    - name: Show dependency versions
      run: >-
        python -c "import sys, importlib.metadata as m;
        print(sys.version);
        print({p: m.version(p) for p in ('duckdb', 'pygeofilter', 'stac-geoparquet')})"
    - name: Verify test discovery
      run: python -m pytest --collect-only -q
    - name: Run execution and spatial tests
      run: python -m pytest -q

  deploy:
    needs: compatibility
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Install dependencies
      run: |
        pip install hatch
    - name: Build package
      run: "hatch build \n"
    - name: Test package
      run: |
        hatch run test:pytest --collect-only -q
        hatch run test:test
    - name: Publish package distributions to PyPI (main)
      if: github.ref == 'refs/heads/main'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://upload.pypi.org/legacy/
    - name: Publish package distributions to PyPI (develop)
      if: github.ref != 'refs/heads/main'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
